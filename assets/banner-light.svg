<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img">
  <title>Kitty Crow, electronics engineer and systems builder</title>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#80cbc4" stroke-width="1" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="330" rx="20" fill="#e8f8f5"/>
  <rect width="1200" height="330" rx="20" fill="url(#grid)"/>
  <rect x="28" y="26" width="1144" height="278" rx="16" fill="#ffffff" stroke="#80cbc4" stroke-width="2"/>
  <rect x="28" y="26" width="1144" height="42" rx="16" fill="#e8f8f5"/>
  <rect x="28" y="50" width="1144" height="18" fill="#e8f8f5"/>
  <circle cx="52" cy="47" r="7" fill="#8f6ad9"/>
  <circle cx="74" cy="47" r="7" fill="#00a8a8"/>
  <circle cx="96" cy="47" r="7" fill="#01579b"/>
  <text x="600" y="53" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#59706d">kitty@kittycrow.dev: ~/workshop</text>

  <g transform="translate(68 92)">
    <path d="M28 33 L48 4 L69 27 L118 27 L139 4 L159 33 L151 111 L37 111 Z" fill="#e8f8f5" stroke="#8f6ad9" stroke-width="5"/>
