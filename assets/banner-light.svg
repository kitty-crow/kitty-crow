    <text x="530" y="118" font-size="16" fill="#333333">whoami</text>
    <text x="290" y="172" font-size="48" font-weight="700" fill="#004d40" filter="url(#glow)">Kitty Crow</text>
    <text x="292" y="207" font-size="20" fill="#333333">Electronics Engineer · systems builder · TypeScript enthusiast</text>
